# KOL 分层候选池。
# 🔴 红线：本文件只是「候选池」，不是「已验证名单」。
#    任何 handle 写进作战卡片前，必须经 x.com/{handle} 实际导航验证。
#    粉丝数/认证状态/注册年份一律以验证时抓到的为准，不得沿用本文件的历史值。
#
# 📦 分享版为空。按你自己的行业新建 pool，池名用小写英文。

tiers:
  T1: 行业顶级声量，粉丝 >100k，媒体/机构级影响力
  T2: 垂直领域专家，粉丝 10k–100k，专业可信度高
  T3: 活跃从业者/小众专家，粉丝 1k–10k，互动率高
  ANALYST: 卖方/买方分析师、研究机构

# 按话题分池。每个候选只记 handle + 领域 + 入选线索，
# 具体数据留给验证环节填。
pools:
  your_industry_en:      # 示例：英文区主话题池，改成你的行业
    T1: []
    T2: []
    T3: []
    ANALYST: []

  your_industry_zh:      # 示例：中文区话题池
    T1: []
    T2: []
    T3: []

# 扩池方法（词库为空时使用）：
#  1. 目标词在 X 搜索 → 按互动排序取近 30 天高互动作者
#  2. 竞品官号的高质量互动者
#  3. 行业媒体记者/编辑的 X 账号
#  4. 中文话题走 TikHub search xhs|weibo|zhihu 按话题捞高互动作者
#  5. 每个新候选走 kol-analyst-outreach.md 的验证流程后回填此文件
